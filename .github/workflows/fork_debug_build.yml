name: 'Fork Debug Build (amd64)'

on:
  push:
    branches: [ all-pr-features-debug ]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'all-pr-features-debug'

env:
  REGISTRY_IMAGE: ghcr.io/slmingol/airsonic-advanced-kagemomiji

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build with Maven
        run: mvn package -DskipTests -B -P docker -Dmaven.buildNumber.skip=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: install/docker/Dockerfile
          context: install/docker
          platforms: linux/amd64
          build-args: |
            IMAGE_JAVA_VERSION=21.0.7_6
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:debug
            ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}
