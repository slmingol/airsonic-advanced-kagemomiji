name: 'Build and Push to GHCR'

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEFAULT_MUSIC_FOLDER: /tmp/music
  EXCLUDED_TEST_GROUPS:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/airsonic-advanced

jobs:
  build-war:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - run: mkdir -p ${DEFAULT_MUSIC_FOLDER}

      - name: Build with Maven
        run: mvn install -DskipTests -B -P docker

      - name: Upload WAR
        uses: actions/upload-artifact@v7
        with:
          name: airsonic-war
          path: install/docker/target/dependency/airsonic-main.war
          retention-days: 1

      - name: Calculate tags
        id: meta
        run: |
          ver=$(grep "version=" airsonic-main/target/generated/build-metadata/build.properties | cut -d"=" -f2)
          ts=$(grep "timestamp=" airsonic-main/target/generated/build-metadata/build.properties | cut -d"=" -f2)
          echo "tag=$ver.$ts" >> $GITHUB_OUTPUT

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

  build-image:
    runs-on: ${{ matrix.runner }}
    needs: build-war
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache_tag: buildcache-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_tag: buildcache-arm64

    steps:
      - name: Prepare platform pair
        id: prep
        run: |
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v7

      - name: Download WAR
        uses: actions/download-artifact@v7
        with:
          name: airsonic-war
          path: install/docker/target/dependency/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          file: install/docker/Dockerfile
          context: install/docker
          platforms: ${{ matrix.platform }}
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:${{ matrix.cache_tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:${{ matrix.cache_tag }},mode=max
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ steps.prep.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build-war, build-image]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:latest \
            -t ${{ env.REGISTRY_IMAGE }}:${{ needs.build-war.outputs.tag }} \
            -t ${{ env.REGISTRY_IMAGE }}:gitcommit-${{ github.sha }} \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' $(ls /tmp/digests))

      - name: Inspect manifest
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:latest
