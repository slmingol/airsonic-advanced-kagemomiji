name: 'Build and Push to GHCR'

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEFAULT_MUSIC_FOLDER: /tmp/music
  EXCLUDED_TEST_GROUPS:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/airsonic-advanced

jobs:
  build-war:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - run: mkdir -p ${DEFAULT_MUSIC_FOLDER}

      - name: Build with Maven
        run: mvn install -DskipTests -B -P docker

      - name: Upload WAR
        uses: actions/upload-artifact@v7
        with:
          name: airsonic-war
          path: install/docker/target/dependency/airsonic-main.war
          retention-days: 1

      - name: Calculate tags
        id: meta
        run: |
          ver=$(grep "version=" airsonic-main/target/generated/build-metadata/build.properties | cut -d"=" -f2)
          ts=$(grep "timestamp=" airsonic-main/target/generated/build-metadata/build.properties | cut -d"=" -f2)
          echo "tag=$ver.$ts" >> $GITHUB_OUTPUT

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

  build-image:
    runs-on: ${{ matrix.runner }}
    needs: build-war
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: amd64
            cache_tag: buildcache-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: arm64
            cache_tag: buildcache-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Download WAR
        uses: actions/download-artifact@v7
        with:
          name: airsonic-war
          path: install/docker/target/dependency/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          file: install/docker/Dockerfile
          context: install/docker
          platforms: ${{ matrix.platform }}
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY_IMAGE }}:${{ matrix.cache_tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY_IMAGE }}:${{ matrix.cache_tag }},mode=max
          tags: ${{ env.REGISTRY_IMAGE }}:build-${{ matrix.tag_suffix }}-${{ github.sha }}

  merge:
    runs-on: ubuntu-latest
    needs: [build-war, build-image]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:latest \
            -t ${{ env.REGISTRY_IMAGE }}:${{ needs.build-war.outputs.tag }} \
            -t ${{ env.REGISTRY_IMAGE }}:gitcommit-${{ github.sha }} \
            ${{ env.REGISTRY_IMAGE }}:build-amd64-${{ github.sha }} \
            ${{ env.REGISTRY_IMAGE }}:build-arm64-${{ github.sha }}

      - name: Inspect manifest
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:latest
